Tweaker.setScriptStage("BIOME_REGISTRY")
# lp = lunar planes
Tweaker.createBiome("lp_badlands", "traverse:badlands")
Tweaker.createBiome("lp_thicket", "traverse:thicket")
# aw = arid waste
Tweaker.createBiome("aw_oil_ocean", "minecraft:ocean")
# mpd = mineral pocket dimension
Tweaker.createBiome("mpd_main", "minecraft:plains")

lpBadlands = forBiomes("biometweaker:lp_badlands")
lpBadlands.set("name", "Blessed Plains")
lpBadlands.addDicTypes("LUNAR_PLANE")

lpThicket = forBiomes("biometweaker:lp_thicket")
lpThicket.set("name", "Dark Thicket")
lpThicket.addDicTypes("LUNAR_PLANE")

awOilOcean = forBiomes("biometweaker:aw_oil_ocean")
awOilOcean.set("name", "Oil Ocean")

Tweaker.setStage("FINISHED_LOAD")
customBiomes = forBiomes("biometweaker:lp_badlands", "biometweaker:lp_thicket", "biometweaker:aw_oil_ocean", "biometweaker:mpd_main")
customBiomes.set("genWeight", 10)
customBiomes.remove()

lpBadlands = forBiomes("biometweaker:lp_badlands")
lpBadlands.removeDecoration("TREE")

mpdMain = forBiomes("biometweaker:mpd_main")
mpdMain.set("name", "Mineral Pocket Dimension")
mpdMain.addDicTypes("MINERAL_POCKET_DIMENSION")
mpdMain.removeDecoration("GRASS")
mpdMain.removeDecoration("PUMPKIN")
mpdMain.removeDecoration("FLOWERS")
mpdMain.removeDecoration("LAKE_WATER")
mpdMain.removeDecoration("LAKE_LAVA")
mpdMain.removeDecoration("TREE")
mpdMain.removeDecoration("SHROOM")

mpdMain.removeFeature("LAKE")
mpdMain.removeFeature("LAVA")